name: Build Windows VST3

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          $f = Get-ChildItem -Recurse -Filter CMakeLists.txt | Select-Object -First 1
          Write-Host "Found: $($f.FullName)"
          cmake -S $f.DirectoryName -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: DelayVerb-VST3-Windows
          path: build/DelayVerb_artefacts/Release/VST3/
